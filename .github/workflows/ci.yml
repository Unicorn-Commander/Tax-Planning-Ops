name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest
      - run: test "$(python - <<'PY'
from pathlib import Path
heads=set(); parents=set()
for p in Path('alembic/versions').glob('*.py'):
    ns={}
    exec(p.read_text(), ns)
    heads.add(ns['revision'])
    d=ns['down_revision']
    if isinstance(d, str): parents.add(d)
    elif isinstance(d, tuple): parents.update(d)
print(len(heads - parents))
PY
)" = "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run build
