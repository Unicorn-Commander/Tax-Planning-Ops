name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Jobs run in a container on the runner's network: reach the service by name (postgres:5432),
    # and publish no host port, so concurrent push and pull_request runs cannot collide.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tax_planning_ops_owner
          POSTGRES_PASSWORD: devowner
          POSTGRES_DB: tax_planning_ops
        options: >-
          --health-cmd "pg_isready -U tax_planning_ops_owner -d tax_planning_ops"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: mypy app
      - run: pytest
      # The MCP door's tests live outside backend/ (testpaths); run them from
      # the repo root with the same interpreter and installs as above.
      - name: mcp server tests
        working-directory: .
        run: python -m pytest mcp/test_server.py
      # Migrate a real Postgres (owner role) then run the RLS isolation test as
      # the NOBYPASSRLS app role.
      - name: migrate + RLS integration test
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://tax_planning_ops_owner:devowner@postgres:5432/tax_planning_ops
          RUNTIME_DB_PASSWORD: dev
          DATABASE_URL: postgresql+asyncpg://tax_planning_ops_app:dev@postgres:5432/tax_planning_ops
          TPO_TEST_DATABASE_URL: postgresql://tax_planning_ops_app:REMOVED@postgres:5432/tax_planning_ops
          TPO_TEST_OWNER_DATABASE_URL: postgresql://tax_planning_ops_owner:REMOVED@postgres:5432/tax_planning_ops
        run: |
          python -m app.db.bootstrap
          # The SSO state-consumption tests (single-use pop, replay, race,
          # expiry, prune) run against this real DB: a skip is a failure.
          pytest -m integration tests/test_oauth_state_db.py -rs > sso.log \
            || { cat sso.log; exit 1; }
          cat sso.log
          ! grep -q SKIPPED sso.log
          pytest -m integration
          # The entitlement door (fake Ops-Center) must really run against
          # Postgres here: a skip is a failure.
          pytest -m integration tests/test_entitlement_door_integration.py -rs > door.log \
            || { cat door.log; exit 1; }
          cat door.log
          ! grep -q SKIPPED door.log
      - name: exactly one alembic head
        run: python scripts/check_alembic_heads.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      # Frontend unit tests (node:test) import .ts sources, so they need the
      # type-stripping flag (Node >= 22.6); no npm script or deps required.
      # The sh glob `app/**/*.test.mjs` does not recurse (sh has no globstar),
      # so the SSO hash tests under app/auth/ were silently skipped. List the
      # SSO test by explicit path so CI really runs the parse/strip logic.
      - name: node:test frontend unit tests
        run: node --experimental-strip-types --test lib/*.test.mjs app/auth/sso-callback-lib.test.mjs
      - run: npm run build
