name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tax_planning_ops_owner
          POSTGRES_PASSWORD: devowner
          POSTGRES_DB: tax_planning_ops
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tax_planning_ops_owner -d tax_planning_ops"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: mypy app
      - run: pytest
      # Migrate a real Postgres (owner role) then run the RLS isolation test as
      # the NOBYPASSRLS app role.
      - name: migrate + RLS integration test
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://tax_planning_ops_owner:devowner@localhost:55432/tax_planning_ops
          RUNTIME_DB_PASSWORD: dev
          TPO_TEST_DATABASE_URL: postgresql://tax_planning_ops_app:REMOVED@localhost:55432/tax_planning_ops
        run: |
          python -m app.db.bootstrap
          pytest -m integration
      - name: exactly one alembic head
        run: python scripts/check_alembic_heads.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
