[tool.pytest.ini_options]
asyncio_mode = "auto"
# Make `app` importable for the plain `pytest` command too (CI runs it; `python -m pytest` adds cwd itself).
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: requires a running Postgres database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "T20"]
ignore = ["B008", "S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S102", "E501", "C408"]
# Dev/QA CLI utilities: printing is the interface.
"scripts/**" = ["T201", "S", "E501", "UP031", "E2"]
# Static reference catalogs: dense prose data (one-sentence `why`/`description`
# per row) reads far better unwrapped than hard-broken at 100 cols.
"app/document_checklists.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "jose",
    "jose.*",
    "boto3",
    "fitz",
    "pypdf",
]
ignore_missing_imports = true
